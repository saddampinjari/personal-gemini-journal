<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="35%" stop-color="#14204F" />
      <stop offset="75%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Star Glow / Gradient -->
    <linearGradient id="geminiStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0F2FE" />
      <stop offset="75%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="accentStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#subtleShadow)" />
  
  <!-- Subtle Border Highlight -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="6" />

  <!-- Ambient Internal Bloom -->
  <circle cx="230" cy="230" r="160" fill="#38BDF8" opacity="0.18" filter="url(#glow)" />
  <circle cx="280" cy="280" r="140" fill="#818CF8" opacity="0.2" filter="url(#glow)" />

  <!-- Main Gemini 4-Pointed Sparkle Star -->
  <!-- Center: 240, 260 | Radius: 140 -->
  <path d="M 235 120 Q 235 260 375 260 Q 235 260 235 400 Q 235 260 95 260 Q 235 260 235 120 Z" 
        fill="url(#geminiStarGrad)" 
        filter="url(#glow)" />

  <!-- Top-Right Accent Sparkle Star -->
  <!-- Center: 375, 145 | Radius: 52 -->
  <path d="M 375 93 Q 375 145 427 145 Q 375 145 375 197 Q 375 145 323 145 Q 375 145 375 93 Z" 
        fill="url(#accentStarGrad)" 
        filter="url(#glow)" />

  <!-- Bottom-Left Tiny Accent Star -->
  <!-- Center: 130, 365 | Radius: 32 -->
  <path d="M 130 333 Q 130 365 162 365 Q 130 365 130 397 Q 130 365 98 365 Q 130 365 130 333 Z" 
        fill="#FFFFFF" 
        opacity="0.85" 
        filter="url(#glow)" />
</svg>