# Google Cloud Build CI/CD Pipeline for Personal Gemini Journal
# Uses Google Artifact Registry and deploys to Cloud Run with Secret Manager & Challenge Labels

steps:
  # 0. Ensure Artifact Registry repository exists
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud artifacts repositories describe cloud-run-source-deploy --location=us-central1 || \
        gcloud artifacts repositories create cloud-run-source-deploy --repository-format=docker --location=us-central1 --description="Cloud Run Docker repository" || true
    id: 'ensure-artifact-repo'

  # 1. Build the production Docker image using Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/personal-gemini-journal:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/personal-gemini-journal:latest'
      - '.'
    id: 'build-image'

  # 2. Deploy to Google Cloud Run with official Hackathon parameters & Secret Manager integration
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'personal-gemini-journal'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/personal-gemini-journal:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,NEXT_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'
      - '--labels=dev-tutorial=cloud-run-ai-challenge'
    id: 'deploy-cloud-run'

# Cloud Build automatically pushes images listed here using native IAM credentials
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/personal-gemini-journal:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/personal-gemini-journal:latest'

options:
  logging: CLOUD_LOGGING_ONLY
