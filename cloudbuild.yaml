# Google Cloud Build CI/CD Pipeline for Personal Gemini Journal
# Automatically builds, containerizes, and deploys to Google Cloud Run on git push

steps:
  # 1. Build the production Docker image with caching
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/personal-gemini-journal:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/personal-gemini-journal:latest'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/personal-gemini-journal:latest'
      - '.'
    id: 'build-image'

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/personal-gemini-journal:$COMMIT_SHA'
    id: 'push-sha'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/personal-gemini-journal:latest'
    id: 'push-latest'

  # 3. Deploy to Google Cloud Run with official Hackathon parameters & Secret Manager integration
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'personal-gemini-journal'
      - '--image=gcr.io/$PROJECT_ID/personal-gemini-journal:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,NEXT_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'
      - '--labels=dev-tutorial=cloud-run-ai-challenge'
    id: 'deploy-cloud-run'

images:
  - 'gcr.io/$PROJECT_ID/personal-gemini-journal:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/personal-gemini-journal:latest'

options:
  logging: CLOUD_LOGGING_ONLY
